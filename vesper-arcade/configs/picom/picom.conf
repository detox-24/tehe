# palette:
# background  = #05070A
# background2 = #191A25
# foreground  = #F6E9C8
# foreground2 = #D9C49E
# color0      = #0C1018
# color1      = #C47A55
# color2      = #A87A8F
# color3      = #E1B56A
# color4      = #9C8CC1
# color5      = #6E6077
# color6      = #F29A7A
# color7      = #FFF2D6
# color8      = #06080D
# color9      = #8A563C
# color10     = #735464
# color11     = #A8844F
# color12     = #6D6288
# color13     = #4B4252
# color14     = #B56C53
# color15     = #CDBFA7

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.6;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#0C1018";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-fixed = false;
blur-background-exclude = [
  "!(class_g = 'Alacritty' || class_g = 'Rofi')"
];

active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-dim = 0.1;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
use-damage = true;
