[window]
opacity = 0.92
decorations = "None"

[window.padding]
x = 12
y = 10

[window.class]
instance = "Alacritty"
general = "Alacritty"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }

[cursor.blinking]
interval = 750

[scrolling]
history = 5000

[terminal]

[colors.primary]
background = "#05070A"
foreground = "#F6E9C8"

[colors.normal]
black   = "#0C1018"
red     = "#C47A55"
green   = "#A87A8F"
yellow  = "#E1B56A"
blue    = "#9C8CC1"
magenta = "#6E6077"
cyan    = "#F29A7A"
white   = "#FFF2D6"

[colors.bright]
black   = "#06080D"
red     = "#8A563C"
green   = "#735464"
yellow  = "#A8844F"
blue    = "#6D6288"
magenta = "#4B4252"
cyan    = "#B56C53"
white   = "#CDBFA7"
