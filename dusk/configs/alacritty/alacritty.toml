[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10.5

[cursor]
style = { shape = "Underline", blinking = "Off" }

[window]
padding = { x = 8, y = 8 }
opacity = 0.88
decorations = "None"

[colors.primary]
background = "#0C0D14"
foreground = "#EBC9AA"

[colors.cursor]
text   = "#0C0D14"
cursor = "#EAAF62"

[colors.selection]
text       = "#0C0D14"
background = "#EAAF62"

[colors.normal]
black   = "#0C0D14"
red     = "#AE5F3C"
green   = "#684890"
yellow  = "#EAAF62"
blue    = "#402E55"
magenta = "#96689F"
cyan    = "#5B3D6E"
white   = "#EBC9AA"

[colors.bright]
black   = "#1E1A2E"
red     = "#AE5F3C"
green   = "#684890"
yellow  = "#EAAF62"
blue    = "#402E55"
magenta = "#96689F"
cyan    = "#5B3D6E"
white   = "#EBC9AA"
