; background  = #010101
; background2 = #2B2425
; foreground  = #F3E196
; foreground2 = #DBC9A8
; color0  = #010101
; color1  = #2B2425
; color2  = #544240
; color3  = #6B4C58
; color4  = #754C66
; color5  = #87586B
; color6  = #8A683C
; color7  = #976970
; color8  = #9E6A5E
; color9  = #9E7481
; color10 = #B08A6B
; color11 = #D0A663
; color12 = #D7B16E
; color13 = #E8C976
; color14 = #DBC9A8
; color15 = #F3E196

[colors]
background = #010101
background-alt = #2B2425
foreground = #F3E196
foreground-alt = #DBC9A8
primary = #6B4C58
secondary = #754C66
alert = #8A683C
dim = #87586B

[bar/main]
width = 100%
height = 28
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=10;2
font-2 = Noto Color Emoji:size=10;1
modules-left = bspwm
modules-center = date
modules-right = cpu memory pulseaudio battery network
tray-position = right
tray-padding = 2
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = true
reverse-scroll = false
label-focused = %{T2}%{T-}
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background-alt}
label-focused-padding = 2
label-occupied = %{T2}%{T-}
label-occupied-foreground = ${colors.primary}
label-occupied-padding = 2
label-empty = %{T2}%{T-}
label-empty-foreground = ${colors.dim}
label-empty-padding = 2
label-urgent = %{T2}%{T-}
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2
ws-icon-0 = I;
ws-icon-1 = II;
ws-icon-2 = III;
ws-icon-3 = IV;
ws-icon-4 = V;
ws-icon-5 = VI;
ws-icon-6 = VII;
ws-icon-7 = VIII;
ws-icon-8 = IX;
ws-icon-9 = X;

[module/date]
type = internal/date
interval = 5
date = %A %d %B
time = %H:%M
label = %{F#754C66}󰥔%{F-}  %date%   %time%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.secondary}
label = %percentage%%
label-foreground = ${colors.foreground-alt}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
label-foreground = ${colors.foreground-alt}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.secondary}
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-alt}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.dim}

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC
poll-interval = 10
format-charging-prefix = "  "
format-charging-prefix-foreground = ${colors.primary}
format-discharging-prefix = "  "
format-discharging-prefix-foreground = ${colors.secondary}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full =   full
label-charging-foreground = ${colors.foreground-alt}
label-discharging-foreground = ${colors.foreground-alt}
label-full-foreground = ${colors.foreground-alt}

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = "󰖩  "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-connected-foreground = ${colors.foreground-alt}
format-disconnected-prefix = "󰖪  "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = offline
label-disconnected-foreground = ${colors.dim}
