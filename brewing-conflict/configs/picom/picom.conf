# PALETTE (strict):
# background  = #010101
# background2 = #2B2425
# foreground  = #F3E196
# foreground2 = #DBC9A8
# color0  = #010101
# color1  = #2B2425
# color2  = #544240
# color3  = #6B4C58
# color4  = #754C66
# color5  = #87586B
# color6  = #8A683C
# color7  = #976970
# color8  = #9E6A5E
# color9  = #9E7481
# color10 = #B08A6B
# color11 = #D0A663
# color12 = #D7B16E
# color13 = #E8C976
# color14 = #DBC9A8
# color15 = #F3E196

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.6;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#010101";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-fixed = false;
blur-background-exclude = [
  "!(class_g = 'Alacritty' || class_g = 'Rofi')"
];

active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-dim = 0.1;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
use-damage = true;
